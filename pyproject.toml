[project]
name = "hrms-backend"
version = "0.1.0"
description = "Talent Council HRMS Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "pydantic-settings",
    "pyyaml",
    "openai",
    "langgraph",
    "sqlalchemy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["prep"]


[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [".", "backend"]
